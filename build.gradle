plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'metal-mod'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		metalcraft {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

ext.isAppleSiliconBuild = System.getProperty('os.name').toLowerCase().contains('mac') &&
	['aarch64', 'arm64'].contains(System.getProperty('os.arch').toLowerCase())
def metalNativeOutput = layout.buildDirectory.file('native/macos-arm64/libmetalcraft.dylib')

tasks.register('compileMetalNative', Exec) {
	onlyIf { isAppleSiliconBuild }
	inputs.files(fileTree('src/native') {
		include '**/*.m', '**/*.h', '**/*.inc'
	})
	outputs.file(metalNativeOutput)

	doFirst {
		metalNativeOutput.get().asFile.parentFile.mkdirs()
	}

	commandLine 'xcrun', 'clang',
		'-O3', '-fobjc-arc', '-fvisibility=hidden', '-dynamiclib',
		'-arch', 'arm64', '-mmacosx-version-min=13.0',
		"-I${System.getProperty('java.home')}/include",
		"-I${System.getProperty('java.home')}/include/darwin",
		'-framework', 'Foundation', '-framework', 'Metal', '-framework', 'QuartzCore', '-framework', 'AppKit',
		'src/native/metalcraft.m', '-o', metalNativeOutput.get().asFile.absolutePath
}

processClientResources {
	if (isAppleSiliconBuild) {
		dependsOn tasks.named('compileMetalNative')
		from(metalNativeOutput) {
			into 'natives/macos-arm64'
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}

apply from: 'gradle/verification.gradle'
apply from: 'gradle/game-tests.gradle'
